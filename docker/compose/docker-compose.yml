services:
  frontend:
    build:
      context: .
      dockerfile: docker/dockerfiles/Dockerfile.frontend
      args:
        - NEXT_PUBLIC_BACKEND_URL=
    container_name: devdocs-frontend
    ports:
      - "3001:3001"
    environment:
      - MCP_HOST=host.docker.internal
    depends_on:
      - backend
    networks:
      - devdocs-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/dockerfiles/Dockerfile.backend
    container_name: devdocs-backend
    ports:
      - "24125:24125"
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./crawl_results:/app/crawl_results
    environment:
      - MCP_HOST=host.docker.internal
      - CRAWL4AI_URL=http://crawl4ai:11235
      - CRAWL4AI_API_TOKEN=devdocs-demo-key
      - DISCOVERY_POLLING_TIMEOUT_SECONDS=300
    depends_on:
      - crawl4ai
    networks:
      - devdocs-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  crawl4ai:
    image: unclecode/crawl4ai:0.9.2
    platform: linux/amd64
    container_name: devdocs-crawl4ai
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_API_TOKEN=devdocs-demo-key
      - MAX_CONCURRENT_TASKS=5
      - DISABLE_AUTH=false
    volumes:
      - /dev/shm:/dev/shm
      - ./crawl_results:/app/crawl_results
    networks:
      - devdocs-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

networks:
  devdocs-network:
    driver: bridge
